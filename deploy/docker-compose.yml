# 서버 환경: MySQL + 앱 + 웹(Caddy: HTTPS, 정적 파일, /api 프록시)
#
#   cd deploy
#   cp .env.example .env        # 비밀값 채우기 (.env는 git에 올라가지 않는다)
#   docker compose up -d --build
#   ./smoke-test.sh             # 프록시를 거쳐 조회, 가입, 주문, 결제까지 확인
#
# 테스트 환경(서버 없이 ./gradlew test, CI)과 분리되어 있다. 자세한 내용은 docs/deploy.md
name: flashdeal

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?.env에 MYSQL_ROOT_PASSWORD를 설정하세요}
      MYSQL_DATABASE: flashdeal
      MYSQL_USER: flashdeal          # 앱은 root가 아니라 이 스키마 전용 계정으로 접속한다
      MYSQL_PASSWORD: ${DB_PASSWORD:?.env에 DB_PASSWORD를 설정하세요}
      TZ: Asia/Seoul
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      retries: 30
    restart: unless-stopped
    # 포트를 외부에 열지 않는다. 앱만 내부 네트워크로 접속한다

  app:
    image: ${IMAGE_PREFIX:-flashdeal}-app:${IMAGE_TAG:-local}
    build: ../backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod   # prod는 mysql 프로필을 함께 켠다. 비밀값이 없으면 기동하지 않는다
      DB_HOST: mysql
      DB_USER: flashdeal
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?.env에 JWT_SECRET을 설정하세요 (openssl rand -base64 32)}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?.env에 ADMIN_PASSWORD를 설정하세요 (12자 이상)}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TZ: Asia/Seoul
    restart: unless-stopped

  web:
    image: ${IMAGE_PREFIX:-flashdeal}-web:${IMAGE_TAG:-local}
    build: ../frontend
    depends_on:
      app:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      APP_UPSTREAMS: app:8080
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy-data:/data              # 발급받은 인증서. 지우면 재발급 요청이 반복돼 발급 한도에 걸릴 수 있다
      - caddy-config:/config
    restart: unless-stopped

volumes:
  mysql-data:
  caddy-data:
  caddy-config:
