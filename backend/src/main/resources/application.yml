spring:
  application:
    name: flashdeal
  profiles:
    group:
      # 운영(prod)은 항상 MySQL로 뜬다. SPRING_PROFILES_ACTIVE=prod 하나만 주면 된다
      prod: mysql
  datasource:
    # 설치 없이 바로 실행되도록 기본은 H2(MySQL 호환 모드). LOCK_TIMEOUT은 비관적 락 대기 시간(ms)
    url: jdbc:h2:mem:flashdeal;MODE=MySQL;DATABASE_TO_LOWER=TRUE;LOCK_TIMEOUT=10000;DB_CLOSE_DELAY=-1
    username: sa
    password:
    hikari:
      maximum-pool-size: 30
  jpa:
    # OSIV를 끄면 트랜잭션 밖의 지연 로딩이 막혀서, 커넥션을 붙잡은 채 외부 API를 호출하는 실수를 막을 수 있다
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway(db/migration)가 관리하고, JPA는 엔티티와 일치하는지 검증만 한다
    properties:
      hibernate:
        default_batch_fetch_size: 100
        jdbc.time_zone: Asia/Seoul

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      # /actuator/health/liveness(프로세스 생존), /actuator/health/readiness(트래픽 받을 준비, DB 포함)
      # 프록시와 컨테이너 헬스체크가 readiness를 보고 요청을 보낼지 정한다
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-system}] %logger{20} - %msg%n"
  level:
    com.flashdeal: INFO

flashdeal:
  jwt:
    # 데모용 키. 운영에서는 반드시 환경변수 JWT_SECRET으로 주입해야 한다 (Base64, 256bit 이상)
    secret: ${JWT_SECRET:Zmxhc2hkZWFsLWRlbW8tc2VjcmV0LWtleS1tdXN0LWJlLWF0LWxlYXN0LTI1Ni1iaXRzIQ==}
    expiration: 2h
  stock:
    strategy: ATOMIC_UPDATE   # NAIVE | PESSIMISTIC | OPTIMISTIC | ATOMIC_UPDATE
  order:
    reservation-ttl: 10m      # 결제 대기 재고 선점 시간
  pg:
    # 비워두면 앱에 내장된 Mock PG(/mock-pg)를 HTTP로 호출한다. 실제 PG를 쓸 때만 URL을 지정한다
    base-url: ${PG_BASE_URL:}
    connect-timeout: 1s
    read-timeout: 2s
    max-attempts: 3
  payment:
    reconcile-grace: 5s       # REQUESTED/UNKNOWN 상태가 이 시간 이상 지나면 대사 대상
  scheduler:
    enabled: true
  dev-tools:
    # 부하 테스트용 재고 전략 전환 API(/api/admin/stock-strategy)를 연다. 운영에서는 반드시 false (NAIVE 전략은 초과 판매가 난다)
    enabled: false
  ai:
    api-key: ${ANTHROPIC_API_KEY:}
    model: claude-opus-5
    timeout: 8s
  seed:
    enabled: true
    # 처음 시드될 때(회원 테이블이 비어 있을 때)만 적용된다
    admin-password: ${ADMIN_PASSWORD:admin}
    # 비밀번호가 알려진 데모 회원(user1, user2). 운영에서는 만들지 않는다
    demo-users: true

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/flashdeal?serverTimezone=Asia/Seoul&createDatabaseIfNotExist=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate

---
# 운영. 데모 기본값(JWT 키, admin/admin, 데모 회원, H2, 개발 도구)으로는 기동하지 않는다 (ProductionGuard)
spring:
  config:
    activate:
      on-profile: prod
  lifecycle:
    timeout-per-shutdown-phase: 20s   # 종료 신호를 받으면 처리 중인 요청을 최대 20초 기다린다

server:
  # 프록시(Caddy)가 붙여 주는 X-Forwarded-* 헤더로 원래 요청의 스킴(https)과 클라이언트 IP를 복원한다
  forward-headers-strategy: framework

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  structured:
    format:
      console: ecs   # 로그 수집기가 읽기 쉬운 JSON. MDC의 traceId, userId가 필드로 들어간다

flashdeal:
  jwt:
    secret: ${JWT_SECRET:}
  seed:
    admin-password: ${ADMIN_PASSWORD:}
    demo-users: false
