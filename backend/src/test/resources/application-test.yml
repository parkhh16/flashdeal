spring:
  datasource:
    url: jdbc:h2:mem:flashdeal-test-${random.uuid};MODE=MySQL;DATABASE_TO_LOWER=TRUE;LOCK_TIMEOUT=20000;DB_CLOSE_DELAY=-1
  jpa:
    properties:
      hibernate:
        generate_statistics: true

logging:
  level:
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: WARN
    com.flashdeal: WARN

flashdeal:
  scheduler:
    enabled: false        # 테스트에서는 스케줄러를 직접 호출해서 결정적으로 검증한다
  seed:
    enabled: false
  demo:
    rotate-deals: false
  pg:
    read-timeout: 1s
  payment:
    reconcile-grace: 0s
  ai:
    api-key: ""           # 테스트는 LLM을 호출하지 않는다 (폴백 경로 검증)
