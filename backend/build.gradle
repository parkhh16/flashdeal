plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.needsshop'
version = '0.0.1'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    // 서버가 여러 대일 때: 사용자 캐시 무효화 전파(Pub/Sub), 레이트 리밋 공유 카운터. 꺼져 있으면 연결하지 않는다
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    // 서버가 여러 대일 때: 스케줄러를 한 서버에서만 실행 (DB 테이블 락)
    implementation 'net.javacrumbs.shedlock:shedlock-spring:6.6.0'
    implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:6.6.0'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'com.mysql:mysql-connector-j'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:mysql' // -Pdb=testcontainers 일 때 Docker로 MySQL을 띄운다 (버전은 Spring Boot가 관리)
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'search-eval' // 검색 품질 평가는 searchEval 태스크로만 실행한다 (합격/불합격이 아니라 수치를 재는 것)
    }
    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = true
        exceptionFormat = 'full'
    }
    // 같은 테스트를 실제 MySQL(InnoDB)에서 실행한다 (기본은 H2)
    //   ./gradlew test -Pdb=mysql          : 이미 떠 있는 MySQL. 접속 정보는 DB_HOST / DB_USER / DB_PASSWORD, 스키마는 needs_shop_test를 새로 만들어 쓴다
    //   ./gradlew test -Pdb=testcontainers : Docker로 MySQL을 띄워서 (설치 불필요, CI용). 서버 환경과 같은 mysql:8.0
    def db = project.findProperty('db')
    if (db == 'mysql') {
        def host = System.getenv('DB_HOST') ?: 'localhost'
        systemProperty 'spring.datasource.url',
                "jdbc:mysql://${host}:3306/needs_shop_test?serverTimezone=Asia/Seoul&createDatabaseIfNotExist=true&rewriteBatchedStatements=true"
        systemProperty 'spring.datasource.username', System.getenv('DB_USER') ?: 'root'
        systemProperty 'spring.datasource.password', System.getenv('DB_PASSWORD') ?: ''
    } else if (db == 'testcontainers') {
        // Testcontainers JDBC URL: 첫 연결 때 컨테이너를 띄우고, TC_DAEMON으로 테스트가 끝날 때까지 하나를 같이 쓴다.
        // TC_MY_CNF는 test 리소스의 mysql-conf 디렉터리 (max_connections를 늘린 설정)
        systemProperty 'spring.datasource.url',
                'jdbc:tc:mysql:8.0:///needs_shop_test?TC_DAEMON=true&TC_MY_CNF=mysql-conf&serverTimezone=Asia/Seoul&rewriteBatchedStatements=true'
        systemProperty 'spring.datasource.driver-class-name', 'org.testcontainers.jdbc.ContainerDatabaseDriver'
        systemProperty 'spring.datasource.username', 'test'
        systemProperty 'spring.datasource.password', 'test'
    }
    if (db == 'mysql' || db == 'testcontainers') {
        // 테스트 컨텍스트가 여러 개 떠 있어도 max_connections를 넘지 않게 커넥션을 작게 잡는다
        systemProperty 'spring.datasource.hikari.maximum-pool-size', '20'
        systemProperty 'spring.datasource.hikari.minimum-idle', '1'
        systemProperty 'spring.datasource.hikari.idle-timeout', '10000'
        systemProperty 'spring.jpa.properties.hibernate.jdbc.time_zone', 'Asia/Seoul'
    }
}

// ./gradlew searchEval -Plabel=이름 : 검색 품질 평가 (시드 상품 25개, 정답을 붙인 질의 72개).
// 리포트는 build/reports/search-eval/<label>.md
tasks.register('searchEval', Test) {
    description = '검색 품질 평가'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'search-eval'
    }
    outputs.upToDateWhen { false }
    testLogging {
        showStandardStreams = true
        exceptionFormat = 'full'
    }
    systemProperty 'search.eval.label', project.findProperty('label') ?: 'latest'
}
