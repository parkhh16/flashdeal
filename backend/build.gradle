plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.flashdeal'
version = '0.0.1'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'
    implementation 'com.anthropic:anthropic-java:2.65.0'
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'com.mysql:mysql-connector-j'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = true
        exceptionFormat = 'full'
    }
    // ./gradlew test -Pdb=mysql : 같은 테스트를 실제 MySQL(InnoDB)에서 실행한다 (기본은 H2)
    // 접속 정보는 DB_HOST / DB_USER / DB_PASSWORD 환경변수, 스키마는 flashdeal_test를 새로 만들어 쓴다
    if (project.findProperty('db') == 'mysql') {
        def host = System.getenv('DB_HOST') ?: 'localhost'
        systemProperty 'spring.datasource.url',
                "jdbc:mysql://${host}:3306/flashdeal_test?serverTimezone=Asia/Seoul&createDatabaseIfNotExist=true&rewriteBatchedStatements=true"
        systemProperty 'spring.datasource.username', System.getenv('DB_USER') ?: 'root'
        systemProperty 'spring.datasource.password', System.getenv('DB_PASSWORD') ?: ''
        // 테스트 컨텍스트가 여러 개 떠 있어도 max_connections(151)를 넘지 않게 커넥션을 작게 잡는다
        systemProperty 'spring.datasource.hikari.maximum-pool-size', '20'
        systemProperty 'spring.datasource.hikari.minimum-idle', '1'
        systemProperty 'spring.datasource.hikari.idle-timeout', '10000'
        systemProperty 'spring.jpa.properties.hibernate.jdbc.time_zone', 'Asia/Seoul'
    }
}
