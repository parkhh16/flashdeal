# 앱 + MySQL을 한 번에 실행한다: docker compose up --build
# (로컬 개발은 설치 없이 H2로도 실행 가능: backend에서 ./gradlew bootRun)
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: flashdeal
      MYSQL_DATABASE: flashdeal
      TZ: Asia/Seoul
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pflashdeal"]
      interval: 5s
      retries: 20

  app:
    build: ./backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: flashdeal
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8080:8080"
